<style>
  .gate{ position:relative; min-height:100vh; min-height:100dvh; display:grid; place-items:center; padding: 3rem var(--pad); overflow:hidden; color:var(--white); text-align:center; background: var(--med-deep); }
  .gate-bg{ position:absolute; inset:0; }
  .gate-bg picture, .gate-bg img{ display:block; width:100%; height:100%; object-fit:cover; }
  .gate-bg::after{ content:""; position:absolute; inset:0; background: rgba(34,51,63,.70); }   /* velo azul: texto blanco con contraste ≥ 4,6:1 */
  .gate-box{ position:relative; z-index:1; max-width:640px; animation: gate-in 1.1s var(--ease-out) both; }
  .gate-mark{ height:64px; width:auto; margin:0 auto 1.6rem; }
  .gate h1{ color:var(--white); font-size: clamp(2.4rem, 7vw, 4.4rem); letter-spacing:.01em; margin-bottom:.35em; text-shadow: 0 2px 28px rgba(10,20,30,.35); }
  .gate-tag{ font-size:.78rem; font-weight:600; letter-spacing:.2em; text-transform:uppercase; color: rgba(247,245,242,.88); margin-bottom: 2.6rem; }
  .gate-pick{ font-size:.82rem; color: rgba(247,245,242,.85); margin-bottom: 1rem; }
  .gate-langs{ display:flex; flex-wrap:wrap; gap:.8rem; justify-content:center; }
  .gate .btn-outline{ min-width:150px; justify-content:center; }
  .gate .btn-outline:hover{ background: rgba(247,245,242,.14); }
  @keyframes gate-in{ from{ opacity:0; transform: translateY(14px); } to{ opacity:1; transform:none; } }
  @media (prefers-reduced-motion: reduce){ .gate-box{ animation:none; } }
  @media (max-width:480px){ .gate-langs{ flex-direction:column; align-items:stretch; } .gate .btn-outline{ min-width:0; } }
</style>
<script>
  /* Idioma del navegador: se prueba cada idioma preferido, en orden, hasta dar con uno disponible. */
  var supported = ["en","es","nl","fr"];
  var prefs = (navigator.languages && navigator.languages.length) ? navigator.languages : [navigator.language || "en"];
  for (var i = 0; i < prefs.length; i++) {
    var code = String(prefs[i]).slice(0,2).toLowerCase();
    if (supported.indexOf(code) > -1) { window.location.replace("{{ site.baseurl }}/" + code + "/"); break; }
  }
</script>

<body>
  <main class="gate">
    <div class="gate-bg" aria-hidden="true">
      <picture>
        <source media="(max-width: 640px) and (orientation: portrait)" srcset="{{ '/assets/img/hero/hero-sea-mobile.webp' | relative_url }}" type="image/webp">
        <source media="(max-width: 1100px) and (orientation: portrait)" srcset="{{ '/assets/img/hero/hero-sea-tablet.webp' | relative_url }}" type="image/webp">
        <source srcset="{{ '/assets/img/hero/hero-sea-desktop.webp' | relative_url }}" type="image/webp">
        <img src="{{ '/assets/img/hero/hero-sea-desktop.jpg' | relative_url }}" alt="" fetchpriority="high" decoding="async">
      </picture>
    </div>
    <div class="gate-box">
      <img class="gate-mark" src="{{ '/assets/img/brand/fyh-mark-white.png' | relative_url }}" width="58" height="64" alt="">
      <h1>Find Your Haven</h1>
      <p class="gate-tag">Mediterranean Coast · Catalonia</p>
      <p class="gate-pick"><span lang="en">Choose your language</span> · <span lang="es">Elige tu idioma</span> · <span lang="nl">Kies je taal</span> · <span lang="fr">Choisissez votre langue</span></p>
      <nav class="gate-langs" aria-label="Language">
        <a class="btn btn-outline" href="{{ '/en/' | relative_url }}" hreflang="en" lang="en">English</a>
        <a class="btn btn-outline" href="{{ '/es/' | relative_url }}" hreflang="es" lang="es">Español</a>
        <a class="btn btn-outline" href="{{ '/nl/' | relative_url }}" hreflang="nl" lang="nl">Nederlands</a>
        <a class="btn btn-outline" href="{{ '/fr/' | relative_url }}" hreflang="fr" lang="fr">Français</a>
      </nav>
    </div>
  </main>
</body>
