<!DOCTYPE html>
<html lang="{{ page.lang | default: 'en' }}">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
{% include seo.html %}
{% if page.hero_slider %}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Organization",
  "name": "Find Your Haven",
  "url": {{ '/' | absolute_url | jsonify }},
  "logo": {{ '/assets/img/brand/fyh-mark-blue.png' | absolute_url | jsonify }},
  "image": {{ '/assets/img/og-cover.jpg' | absolute_url | jsonify }},
  "description": {{ page.description | jsonify }},
  "email": "hello@findyourhaven.com",
  "areaServed": ["Costa Brava", "Empordà", "Maresme", "Sitges", "Costa Daurada", "Catalonia"],
  "knowsLanguage": ["en", "es", "nl", "fr"]
}
</script>
{% endif %}
{% if page.hero_slider %}
<!-- Precarga de la primera imagen del hero (la que se ve al entrar), según dispositivo -->
<link rel="preload" as="image" type="image/webp" fetchpriority="high" href="{{ '/assets/img/hero/hero-sea-mobile.webp' | relative_url }}" media="(max-width: 640px) and (orientation: portrait)">
<link rel="preload" as="image" type="image/webp" fetchpriority="high" href="{{ '/assets/img/hero/hero-sea-tablet.webp' | relative_url }}" media="(min-width: 641px) and (max-width: 1100px) and (orientation: portrait)">
<link rel="preload" as="image" type="image/webp" fetchpriority="high" href="{{ '/assets/img/hero/hero-sea-desktop.webp' | relative_url }}" media="(orientation: landscape), (min-width: 1101px)">
{% endif %}
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;1,400&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,400;1,500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
<link rel="icon" type="image/png" sizes="32x32" href="{{ '/assets/img/favicon-32.png' | relative_url }}">
<link rel="icon" type="image/png" sizes="192x192" href="{{ '/assets/img/favicon-192.png' | relative_url }}">
<link rel="apple-touch-icon" href="{{ '/assets/img/apple-touch-icon.png' | relative_url }}">
</head>
<body>
{% include header.html %}
{{ content }}
{% include footer.html %}
<script src="{{ '/assets/js/site.js' | relative_url }}"></script>
<script src="{{ '/assets/js/wizard.js' | relative_url }}"></script>
<script src="{{ '/assets/js/journal.js' | relative_url }}"></script>
</body>
</html>
